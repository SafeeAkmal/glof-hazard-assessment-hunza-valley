# Reduced, AHP-inspired susceptibility index — NOT a reproduction of
# Muneeb et al.'s full framework (Guardrail L1, DEC-014).
# Feature count and weights are NOT frozen. See docs/DECISIONS.md
# Decision D-J (terminus distance in/out) and D-H (weights), in that order —
# D-J must be settled before D-H's weights can be finalized.

include_terminus_distance: null   # TBD — Decision D-J. If true, requires glacier-outline source below.
glacier_outline_source: null      # TBD — Decision D-J; proposed default "RGI 7.0"

features:
  area:
    time_varying: true
    normalization: "min_max_pooled_training"   # proposed default
  growth_rate:
    time_varying: true
    normalization: "min_max_pooled_training"
  slope:
    time_varying: false
    normalization: "min_max_pooled_training"
  terminus_distance:
    time_varying: false
    normalization: "min_max_pooled_training"
    conditional_on: include_terminus_distance

weights:
  # TBD — Decision D-H (core scientific decision, requires team sign-off).
  # Proposed baseline default (NOT frozen): equal weighting.
  # 0.25 each if 4 features are used, 0.333 each if terminus_distance is dropped (Decision D-J = false).
  area: null
  growth_rate: null
  slope: null
  terminus_distance: null

sensitivity_analysis:
  required: true   # DEC-015 — mandatory regardless of which weights are chosen
  alternate_schemes: []   # to be filled once D-H is resolved — proposed default: at least 2 alternates (e.g. growth-rate-weighted, terrain-weighted)

validation:
  lead_window_months: 6   # proposed default — Category 4
  retrospective_only: true  # DO NOT present as operational early-warning capability — Guardrail L4
