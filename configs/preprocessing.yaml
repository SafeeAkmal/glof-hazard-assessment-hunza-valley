# Values marked FROZEN are settled (see docs/DECISIONS.md for the decision ID).
# Values marked "proposed default" are Category-4 configurable choices that
# can be used now but may change without upstream rework.
# Values marked TBD require a Category-3 team decision before use (docs/DECISIONS.md).

grid:
  target_crs: "EPSG:32643"   # FROZEN — DEC-023 (UTM 43N, verified by geodetic computation)
  target_resolution_m: 10    # target; source DEM is 30 m — DEC-008
  grid_origin: null          # TBD
  resampling_continuous: "bilinear"   # proposed default
  resampling_categorical: "nearest"   # proposed default

patch:
  size_px: null       # TBD — Decision D-E; proposed default 256
  stride_train_px: null   # TBD — Decision D-E; proposed default 128
  stride_inference: "non-overlapping"  # proposed default for full-AOI time-series inference

sar:
  speckle_filter: "refined_lee"
  speckle_filter_window: null   # TBD, implementation-time default
  do_not_reapply_calibration_or_terrain_correction: true  # DEC-007, DEC-029

optical:
  bands: null          # TBD — Decision D-B; proposed default [B02, B03, B04, B08]
  ndwi_bands: {green: "B03", nir: "B08"}
  channel_order: null  # TBD — Decision D-B; proposed default [B02, B03, B04, B08, NDWI]

fusion:
  include_slope_channel: null  # TBD — Decision D-C; proposed default true
  channel_order: null          # TBD — depends on D-B and D-C

cloud_stratification:
  thresholds_pct: null   # TBD — Decision D-G; proposed default {clear: "<10", partial: "10-50", heavy: ">50"}
  basis: null             # TBD — Decision D-G; proposed default "scene-level cloud probability"
