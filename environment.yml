name: glof-fusion
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.11
  - pip
  - numpy=1.26.*
  - rasterio=1.3.*
  - gdal=3.8.*
  - geopandas=0.14.*
  - shapely=2.0.*
  - pyproj=3.6.*
  - scikit-image=0.22.*
  - scikit-learn=1.4.*
  - matplotlib=3.8.*
  - pytest=8.*
  - pyyaml=6.*
  - pip:
      - earthengine-api==0.1.*
      - geemap==0.32.*
      - torch==2.2.*
      - torchvision==0.17.*
      - segmentation-models-pytorch==0.3.*
